services:
  # ----------------------------------------------------------------------------
  # Backend FastAPI Web Service (Native Python)
  # ----------------------------------------------------------------------------
  - type: web
    name: monday-bi-agent-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONDAY_API_KEY
        sync: false
        description: "Monday.com API v2 token"
      - key: OPENAI_API_KEY
        sync: false
        description: "OpenAI GPT API Key"
      - key: WORK_ORDER_BOARD_ID
        sync: false
        description: "Monday.com Work Orders Board ID"
      - key: DEALS_BOARD_ID
        sync: false
        description: "Monday.com Deals Board ID"
      - key: PORT
        value: "8000"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (Vanilla HTML/CSS/JS)
  # ----------------------------------------------------------------------------
  - type: web
    name: monday-bi-agent-frontend
    env: static
    buildCommand: ""
    staticPublishPath: "frontend"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://monday-bi-agent-backend.onrender.com"
        description: "The live URL of the backend service"
