services:
  # ----------------------------------------------------------------------------
  # Backend FastAPI Web Service (Native Python)
  # ----------------------------------------------------------------------------
  - type: web
    name: monday-bi-agent-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONDAY_API_KEY
        sync: false
        description: "Monday.com API v2 token"
      - key: OPENAI_API_KEY
        sync: false
        description: "OpenAI GPT API Key"
      - key: WORK_ORDER_BOARD_ID
        sync: false
        description: "Monday.com Work Orders Board ID"
      - key: DEALS_BOARD_ID
        sync: false
        description: "Monday.com Deals Board ID"
      - key: PORT
        value: "8000"

  # ----------------------------------------------------------------------------
  # Frontend Static Site (Vanilla HTML/CSS/JS)
  # ----------------------------------------------------------------------------
  - type: web
    name: monday-bi-agent-frontend
    env: python
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: "python -m http.server --directory frontend $PORT"
    envVars:
      - key: PORT
        value: "3000"
